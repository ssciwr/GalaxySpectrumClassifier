path: ../data/silver/default
data_format: csv
label_columns: source

# Store the loaded, filtered, and mapped Arrow files in a project-local cache.
hf_dataset_kwargs:
  cache_dir: ../.cache/huggingface/datasets

# Keep only rows where the OII_3727 emission line is at most 2.0.
pre_filter: __main__.keep_oii_below
pre_filter_kwargs:
  fn_kwargs:
    maximum: 2.0

# Double OII_3727 in every retained row.
pre_transform: __main__.scale_column
pre_transform_kwargs:
  fn_kwargs:
    column: OII_3727
    factor: 2.0
