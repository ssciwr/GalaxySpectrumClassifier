# Example: RandomForest + probability calibration on the classification_v2
# Cloudy grids (AGN vs. star-forming). Paths are relative to notebooks/.
trainer:
  output_path: ../training/binaryclassifier_simple_example
  model_type: sklearn.ensemble.RandomForestClassifier
  model_args:
  model_kwargs:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 1
    class_weight: balanced_subsample
    n_jobs: -1
    random_state: 42
  # The calibrator wraps the model as its `estimator=` and becomes what is
  # actually fitted/evaluated. isotonic needs a good amount of data per fold;
  # switch to "sigmoid" if the training split is small.
  calibrator_type: sklearn.calibration.CalibratedClassifierCV
  calibrator_args:
  calibrator_kwargs:
    method: isotonic
    cv: 5
    ensemble: true
    n_jobs: -1
  # Must be one of utils.TASKS - it decides the predict_proba shape handed
  # to needs_proba metrics (positive-class column for binary).
  task: binary-classification
  metrics:
    - name: accuracy
      type: sklearn.metrics.accuracy_score
      kwargs:
      needs_proba: false
    - name: balanced_accuracy
      type: sklearn.metrics.balanced_accuracy_score
      kwargs:
      needs_proba: false
    - name: f1
      type: sklearn.metrics.f1_score
      kwargs:
        average: binary
        zero_division: 0
      needs_proba: false
    - name: precision
      type: sklearn.metrics.precision_score
      kwargs:
        average: binary
        zero_division: 0
      needs_proba: false
    - name: recall
      type: sklearn.metrics.recall_score
      kwargs:
        average: binary
        zero_division: 0
      needs_proba: false
    - name: matthews_corrcoef
      type: sklearn.metrics.matthews_corrcoef
      kwargs:
      needs_proba: false
    # The three below score against predict_proba()[:, 1] - these are the ones
    # that actually show whether the calibrator earned its keep.
    - name: roc_auc
      type: sklearn.metrics.roc_auc_score
      kwargs:
      needs_proba: true
    - name: average_precision
      type: sklearn.metrics.average_precision_score
      kwargs:
      needs_proba: true
    - name: log_loss
      type: sklearn.metrics.log_loss
      kwargs:
      needs_proba: true
    - name: brier
      type: sklearn.metrics.brier_score_loss
      kwargs:
      needs_proba: true
  seed: 42
# Reuse the already-preprocessed Arrow cache written by dataset_examples.ipynb.
dataset:
  data_format: arrow
  label_columns: source_label
  hf_dataset_kwargs:
    data_files: ../data/silver/default/csv/**/cache-*.arrow
