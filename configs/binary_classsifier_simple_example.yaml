# Example: RandomForest + probability calibration on the classification_v2
# Cloudy grids (AGN vs. star-forming). Paths are relative to notebooks/.
trainer:
  output_path: ../training/binaryclassifier_simple_example
  model_type: sklearn.ensemble.RandomForestClassifier
  model_args:
  model_kwargs:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 1
    class_weight: balanced_subsample
    n_jobs: -1
    random_state: 42
  # The calibrator wraps the model as its `estimator=` and becomes what is
  # actually fitted/evaluated. isotonic needs a good amount of data per fold;
  # switch to "sigmoid" if the training split is small.
  calibrator_type: sklearn.calibration.CalibratedClassifierCV
  calibrator_args:
  calibrator_kwargs:
    method: isotonic
    cv: 5
    ensemble: true
    n_jobs: -1
  # Must be one of trainer.TASKS - it decides the predict_proba shape handed
  # to needs_proba metrics (positive-class column for binary).
  task: binary-classification
  metrics:
    -
      name: accuracy
      type: sklearn.metrics.accuracy_score
      args:
      kwargs:
      needs_proba: false
    -
      name: balanced_accuracy
      type: sklearn.metrics.balanced_accuracy_score
      args:
      kwargs:
      needs_proba: false
    -
      name: f1
      type: sklearn.metrics.f1_score
      args:
      kwargs:
        average: binary
        zero_division: 0
      needs_proba: false
    -
      name: precision
      type: sklearn.metrics.precision_score
      args:
      kwargs:
        average: binary
        zero_division: 0
      needs_proba: false
    -
      name: recall
      type: sklearn.metrics.recall_score
      args:
      kwargs:
        average: binary
        zero_division: 0
      needs_proba: false
    -
      name: matthews_corrcoef
      type: sklearn.metrics.matthews_corrcoef
      args:
      kwargs:
      needs_proba: false
    # The three below score against predict_proba()[:, 1] - these are the ones
    # that actually show whether the calibrator earned its keep.
    -
      name: roc_auc
      type: sklearn.metrics.roc_auc_score
      args:
      kwargs:
      needs_proba: true
    -
      name: average_precision
      type: sklearn.metrics.average_precision_score
      args:
      kwargs:
      needs_proba: true
    -
      name: log_loss
      type: sklearn.metrics.log_loss
      args:
      kwargs:
      needs_proba: true
    -
      name: brier
      type: sklearn.metrics.brier_score_loss
      args:
      kwargs:
      needs_proba: true
  seed: 42
  # Forwarded to dataset.to_xy() in fit/validate/test.
  data_xy_kwargs:
    label_column: source
    feature_columns:
    drop_duplicates: true
dataset:
  path: ../data/classification_v2
  engine: python
  comment: "#"
  na_values:
    - nan
    - NaN
  # The grid files are whitespace-separated, not comma-separated; this is a
  # regex, hence engine: python above.
  sep: ","
  read_kwargs:
  suffix: .csv
  # transform/pre_transform/pre_filter accept a dotted path to a module-level
  # callable, e.g. "GalaxySpectrumClassifier.utils.identity". Setting either
  # pre_* switches the dataset into cache_on_disk mode, which needs cache_path.
  transform:
  pre_transform: GalaxySpectrumClassifier.utils.identity
  pre_filter:
  n_workers: 5
  cache_path: ../data/classification_v2_cache

  # Requires cache_on_disk (i.e. pre_transform/pre_filter + cache_path), so it
  # stays unset here. Example once you have those:
  #   imputer:
  #     type: sklearn.impute.SimpleImputer
  #     kwargs:
  #       strategy: median
  imputer:
    type: sklearn.impute.SimpleImputer
    kwargs:
      strategy: median
